[package]
name = "panostem"
version = "0.5.0-alpha.1"
description = "Panostem - concept-driven STEM learning and ManimGL authoring"
authors = ["Yur Stya <yurstya@gmail.com>"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "stem_visual_explorer_lib"
crate-type = ["rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.27"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
open = { version = "5", optional = true }
log = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:open", "dep:tauri-build"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

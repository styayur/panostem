name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit tests (search + translation logic)
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:web
      - name: Pages build smoke test
        run: npm run test:web:build

  desktop:
    name: Windows desktop compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - name: Check Tauri windows and commands
        working-directory: src-tauri
        run: cargo check --locked

  core:
    name: Core logic (Rust tests + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint pure logic
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Parser / query / ranking tests
        working-directory: src-tauri
        run: cargo test --no-default-features

  runtime-contracts:
    name: Runtime contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/runtime -v

  manimgl:
    name: ManimGL real OpenGL render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Native graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config libgl1-mesa-dri libegl1 libglx-mesa0 xvfb xauth
      - run: uv venv --python 3.11.14 .panostem-runtime/venv
      - run: uv pip sync --python .panostem-runtime/venv/bin/python --require-hashes src-tauri/runtime/requirements.lock
      - name: Render and decode five real scenes
        run: xvfb-run -a .panostem-runtime/venv/bin/python scripts/runtime_smoke.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: manimgl-real-render
          path: |
            .panostem-runtime/smoke-evidence.json
            .panostem-runtime/smoke-*/renders/smoke/scene.mp4
            .panostem-runtime/smoke-*/renders/smoke/thumbnail.png

  retrieval:
    name: Retrieval quality and TS/Rust parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run ontology:validate
      - run: npm run index:quality
        env:
          SVE_INDEX_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run benchmark
      - run: npm run benchmark:adversarial
      - run: npm run test:parity
      - name: Retain retrieval measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-quality
          path: |
            artifacts/retrieval-benchmark*.json
            artifacts/provider-quality.json
            artifacts/ontology-statistics.json
            artifacts/adversarial-query*.json
